name: UFS Custom Checks

on:
  push:
    branches: ['feature/no_octaltraps']
  pull_request:
    branches: [develop]

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-standards:
    name: Enforce Repo Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Bash Octal Traps
        run: |
          echo "Scanning for unprotected variables in arithmetic expansions..."
          echo "Scanning tests/default_vars.sh and tests/tests/*"
          UNPROTECTED=$(perl -ne '
            my $line = $_;
            next if $line =~ /^\s*#/;
            my $flagged = 0;
            while ($line =~ /\$\(\((.*?)\)\)/g) {
              my $expr = $1;

              # Case 1: explicit variable expansion ($VAR or ${VAR}) not protected by 10#
              while ($expr =~ /(\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)/g) {
                my $start = $-[1];
                my $before = substr($expr, 0, $start);
                if ($before !~ /10#\s*$/) {
                  $flagged = 1;
                  last;
                }
              }

              # Case 2: bare variable names in arithmetic context (e.g., SHOUR*3600)
              # These are also vulnerable to octal interpretation and should be flagged.
              if (!$flagged) {
                while ($expr =~ /\b([A-Za-z_][A-Za-z0-9_]*)\b/g) {
                  my $start = $-[1];
                  my $before = substr($expr, 0, $start);

                  # Skip identifiers that are part of $VAR or ${VAR}.
                  my $prev1 = $start > 0 ? substr($expr, $start - 1, 1) : "";
                  my $prev2 = $start > 1 ? substr($expr, $start - 2, 2) : "";
                  next if $prev1 eq q|$| || $prev2 eq q|${|;

                  # Skip identifiers that are part of base literals like 16#FF.
                  next if $before =~ /\d+#\s*$/;

                  $flagged = 1;
                  last;
                }
              }

              last if $flagged;
            }
            print "$ARGV:$.:$_" if $flagged;
          ' tests/default_vars.sh tests/tests/*)

          if [[ -n "$UNPROTECTED" ]]; then
            echo "::error::🚨 OCTAL TRAP DETECTED! Variables inside math expansions must use the 10# prefix."
            echo "The following lines are missing 10# protection:"
            echo "$UNPROTECTED"
            exit 1
          fi

          echo "✅ All variable math expansions are safely protected!"

